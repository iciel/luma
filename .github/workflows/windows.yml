name: Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -C target-feature=+crt-static
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --package luma --all-targets --target x86_64-pc-windows-msvc --no-default-features --features parallel,oxipng,webp,jpeg-decode --no-deps -- -D warnings
      - name: Test
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: 2
        run: cargo test --locked --package luma --all-targets --target x86_64-pc-windows-msvc --no-default-features --features parallel,oxipng,webp,jpeg-decode
      - name: Verify PNG and WebP presets
        run: |
          python -m pip install pillow==12.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = "target/x86_64-pc-windows-msvc/debug/luma.exe"
          foreach ($preset in @("quality", "fast")) {
            python scripts/verify-png.py --exe $exe --output "dist/png-$preset" --preset $preset
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python scripts/verify-webp.py --exe $exe --output "dist/webp-$preset" --preset $preset
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build image CLI
        run: cargo build --release --locked --package luma --bin luma --target x86_64-pc-windows-msvc --no-default-features --features parallel,oxipng,webp,jpeg-decode
      - name: Package executable and licenses
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item -LiteralPath target/x86_64-pc-windows-msvc/release/luma.exe -Destination package/
          Copy-Item -LiteralPath LICENSE -Destination package/
          python scripts/release-notices.py --target x86_64-pc-windows-msvc --no-default-features --features parallel,oxipng,webp,jpeg-decode --output package/THIRD_PARTY_LICENSES.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Commit: $env:GITHUB_SHA`nTarget: x86_64-pc-windows-msvc`nFeatures: parallel,oxipng,webp,jpeg-decode`n" | Set-Content -LiteralPath package/BUILD.txt
          $checksum = (Get-FileHash -LiteralPath package/luma.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  luma.exe" | Set-Content -LiteralPath package/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: luma-windows-x64
          path: package/
          if-no-files-found: error
          retention-days: 30
