[package]
name = "luma"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "Native PNG and WebP compression with quality and fast presets"
readme = "README.md"
repository = "https://github.com/iciel/luma"
# Native library and CLI sources.
include = ["/src", "/tests", "/README.md", "/LICENSE"]

[features]
default = ["parallel", "oxipng", "webp", "jpeg-decode"]
# Threads for palettes, remapping, scoring and oxipng.
# Results don't depend on the number of threads.
parallel = ["dep:rayon", "fast-ssim2/rayon", "oxipng?/parallel"]
# compress() recompresses its final file with oxipng -o 2.
oxipng = ["dep:oxipng"]
# WebP output (luma::compress_webp), with the vendored libwebp (vendor/libwebp).
webp = ["dep:libwebp"]
# JPEG input decoding.
jpeg-decode = ["dep:zune-jpeg", "dep:zune-core"]

[dependencies]
crc32fast = "1.5.3"
fast-ssim2 = "0.9.0"
# Math functions that give the same bits on every platform (std's come from the system libm on
# native targets).
libm = "0.2.16"
libwebp = { package = "pngdeer-libwebp", path = "vendor/libwebp", optional = true }
miniz_oxide = "0.9.1"
oxipng = { version = "10.2.1", default-features = false, optional = true }
png = "0.18.1"
rayon = { version = "1", optional = true }
rgb = { version = "0.8.53", default-features = false, features = ["as-bytes"] }
# Without its x86 and neon features: its plain Rust decoding gives the same pixels on every target.
zune-core = { version = "0.5", optional = true }
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std"], optional = true }

[workspace]
members = ["."]
default-members = ["."]
resolver = "2"

# fast-ssim2 with speed and memory patches (same scores), for every build: see vendor/fast-ssim2/PATCHES.md.
[patch.crates-io]
fast-ssim2 = { path = "vendor/fast-ssim2" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
